<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>as.is Protein | Four Flavors, Zero Compromise</title>
<meta name="description" content="20g of clean protein, 3.6g BCAA, and only sugar from nature — as.is Protein in four flavors. Vegan friendly, Badatz certified.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0a0a0a;
    --text-color: #ffffff;
    --accent-color: #ffffff;
    --muted-color: rgba(255, 255, 255, 0.7);
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-main: 'Inter', sans-serif;
    --font-heading: 'Galada', cursive;

    /* Dynamic Background Variables */
    --bg-inner: #4d6b24;
    --bg-mid: #23330f;
    --bg-outer: #070a02;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
    color: var(--text-color);
    font-family: var(--font-main);
    overflow: hidden; /* Remove scroll */
    height: 100vh;
    transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 1. Bubbles container */
#bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.12) 60%, transparent 80%);
    pointer-events: none;
}

@keyframes floatUpImg {
    0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% {
        transform: translateY(-110vh) translateX(30px) rotate(360deg);
        opacity: 0;
    }
}

/* 2. Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 4%;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 700;
    font-size: 1.2rem;
    font-family: var(--font-heading);
}

.nav {
    display: flex;
    gap: 0.5rem;
    background: var(--glass-bg);
    padding: 0.4rem;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
}

.nav.glass {
    position: relative;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.nav-item {
    font-family: 'Manrope', sans-serif;
    color: var(--muted-color);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.5rem 1.2rem;
    border-radius: 100px;
    transition: all 0.3s ease;
}

.nav-item:hover,
.nav-item.active {
    background: #fbcfe8;
    color: #011d17;
}

.contact-btn {
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 0.9rem 2rem;
    border-radius: 100px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: none;
}

.contact-btn:hover {
    background: rgba(0, 0, 0, 0.7);
    transform: translateY(-2px);
    box-shadow: none;
}

/* 3. Hero */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4%;
    padding-top: 5rem;
}

.hero-content {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    width: 100%;
    max-width: 100%;
    padding: 0;
    height: 100%;
    position: relative;
}

/* Typography */
.main-title,
.side-title {
    font-family: var(--font-heading);
    font-size: clamp(3.5rem, 6.5vw, 8rem);
    line-height: 0.85;
    font-weight: 400;
    text-transform: none;
    white-space: nowrap;
    color: white;
    letter-spacing: normal;
}

.outline {
    color: var(--text-color);
}

/* 3b. Left column */
.hero-left {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 6rem 0;
    gap: 1.5rem;
    z-index: 100;
    max-width: 420px;
}

.description {
    color: var(--muted-color);
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 380px;
}

.cta-group {
    display: flex;
}

.primary-btn {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 0.4rem 0.4rem 0.4rem 1.5rem;
    border-radius: 100px;
    font-weight: 700;
    cursor: pointer;
    width: fit-content;
    transition: all 0.3s ease;
    box-shadow: none;
}

.primary-btn:hover {
    background: rgba(0, 0, 0, 0.7);
    transform: translateY(-3px);
    box-shadow: none;
}

.plus-icon {
    background: #fbcfe8;
    color: #011d17;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 1.4rem;
    font-weight: 900;
    line-height: 1;
    padding-bottom: 2px;
    border: none;
}

.award-badge {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: auto;
}

.award-icon {
    width: 48px;
    height: 48px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.award-text { display: flex; flex-direction: column; }
.award-title { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted-color); }
.award-subtitle { font-size: 0.85rem; font-weight: 600; }

/* 3c. Center product stack */
.hero-products {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1.4vh;
    height: 100%;
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    z-index: 5;
    perspective: 1400px;
    opacity: 0;
    animation: fadeIn 1.5s ease-out 0.3s forwards;
}

@keyframes fadeIn { to { opacity: 1; } }

.hero-products-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 140%;
    height: 140%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at center, rgba(141, 174, 74, 0.14) 0%, transparent 70%);
    z-index: -1;
    pointer-events: none;
}

.product-item {
    width: 100%;
    display: flex;
    justify-content: center;
}

.product-photo {
    height: 17vh;
    width: auto;
    max-width: 100%;
    display: block;
    filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.45));
    pointer-events: none;
}

@keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.product-item:nth-child(1) { animation: bob 7s ease-in-out infinite; }
.product-item:nth-child(2) { animation: bob 8s ease-in-out infinite -2s; }
.product-item:nth-child(3) { animation: bob 6.5s ease-in-out infinite -4s; }
.product-item:nth-child(4) { animation: bob 9s ease-in-out infinite -1s; }

/* 3d. Decorative pistachios (few, subtle, edges only) */
.pistachios-container-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.pistachio {
    position: absolute;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.25));
}

@keyframes driftSlow {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(10px, -14px) rotate(6deg); }
}

.pd1 { top: 10%; left: 5%; width: 65px; opacity: 0.35; animation: driftSlow 13s ease-in-out infinite; }
.pd2 { bottom: 12%; right: 6%; width: 85px; opacity: 0.3; animation: driftSlow 16s ease-in-out infinite -5s; }
.pd3 { top: 62%; left: 3%; width: 50px; opacity: 0.28; animation: driftSlow 11s ease-in-out infinite -3s; }

/* 3e. Right column */
.hero-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    text-align: right;
    height: 100%;
    padding: 6rem 0;
    z-index: 100;
    max-width: 420px;
    pointer-events: none;
}

.side-title { align-self: flex-end; text-align: right; }

@keyframes shine {
    from { transform: translateX(-100%) rotate(45deg); }
    to { transform: translateX(200%) rotate(45deg); }
}

@media (max-width: 1200px) {
    .hero-content { flex-direction: column; padding-top: 2rem; gap: 1rem; justify-content: flex-start; }
    .hero-left, .hero-right { max-width: 100%; height: auto; padding: 1rem 0; align-items: center; text-align: center; }
    .hero-left { order: 2; }
    .hero-products { order: 1; height: auto; flex: none; gap: 0.8vh; }
    .hero-right { order: 3; }
    .main-title, .side-title { font-size: 3rem; white-space: normal; }
    .product-photo { height: 11vh; }
    .description { max-width: 100%; }
    .award-badge { margin-top: 1rem; }
}
</style>
</head>

            <ellipse cx="50" cy="30" rx="11" ry="17" fill="#93b34f"/>
            <path d="M46 40 C 48 46, 54 46, 56 40 C 54 43, 48 43, 46 40 Z" fill="#b4436c" opacity="0.85"/>
        </symbol>
    </defs>
</svg>

<script>
const heroProducts = document.getElementById('hero-products');
const pistachiosBG = document.querySelector('.pistachios-container-bg');

let mouse = { x: 0, y: 0 };
let currentMouse = { x: 0, y: 0 };

window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) - 0.5;
    mouse.y = (e.clientY / window.innerHeight) - 0.5;
});

function animate() {
    currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
    currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

    // Gentle collective tilt of the product stack toward the cursor
    heroProducts.style.transform = `rotateY(${currentMouse.x * 10}deg) rotateX(${-currentMouse.y * 6}deg)`;

    // Subtle background parallax for the decorative pistachios
    pistachiosBG.style.transform = `translate(${currentMouse.x * -20}px, ${currentMouse.y * -20}px)`;

    requestAnimationFrame(animate);
}

animate();

// Ambient rising particles
const bubblesContainer = document.getElementById('bubbles-container');
function createBubble() {
    if (!bubblesContainer) return;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random() * 20 + 10 + 'px';
    bubble.style.width = size;
    bubble.style.height = size;
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.bottom = '-50px';
    bubble.style.opacity = Math.random() * 0.4 + 0.2;

    const duration = Math.random() * 6 + 4;
    bubble.style.animation = `floatUpImg ${duration}s linear forwards`;

    bubblesContainer.appendChild(bubble);
    setTimeout(() => bubble.remove(), duration * 1000);
}
setInterval(createBubble, 400);
</script>
</body>
</html>
