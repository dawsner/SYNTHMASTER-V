<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>as.is Protein | Pistachio Halva Protein Bar</title>
<meta name="description" content="20g of clean protein, 3.6g BCAA, and only sugar from nature — as.is Protein in pistachio halva flavor. Vegan friendly, Badatz certified.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0a0a0a;
    --text-color: #ffffff;
    --accent-color: #ffffff;
    --muted-color: rgba(255, 255, 255, 0.7);
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-main: 'Inter', sans-serif;
    --font-heading: 'Galada', cursive;

    /* Dynamic Background Variables */
    --bg-inner: #4d6b24;
    --bg-mid: #23330f;
    --bg-outer: #070a02;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
    color: var(--text-color);
    font-family: var(--font-main);
    overflow: hidden; /* Remove scroll */
    height: 100vh;
    transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body.blue-theme {
    --bg-inner: #0b4f8a;
    --bg-mid: #04294e;
    --bg-outer: #010c14;
}

/* 1. Bubbles container */
#bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.12) 60%, transparent 80%);
    pointer-events: none;
}

@keyframes floatUpImg {
    0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% {
        transform: translateY(-110vh) translateX(30px) rotate(360deg);
        opacity: 0;
    }
}

/* 2. Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 4%;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 700;
    font-size: 1.2rem;
    font-family: var(--font-heading);
}

.nav {
    display: flex;
    gap: 0.5rem;
    background: var(--glass-bg);
    padding: 0.4rem;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
}

.nav.glass {
    position: relative;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.nav-item {
    font-family: 'Manrope', sans-serif;
    color: var(--muted-color);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.5rem 1.2rem;
    border-radius: 100px;
    transition: all 0.3s ease;
}

.nav-item:hover,
.nav-item.active {
    background: #fbcfe8;
    color: #011d17;
}

.contact-btn {
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 0.9rem 2rem;
    border-radius: 100px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: none;
}

.contact-btn:hover {
    background: rgba(0, 0, 0, 0.7);
    transform: translateY(-2px);
    box-shadow: none;
}

/* 3. Hero */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4%;
    padding-top: 5rem;
}

.hero-content {
    display: flex;
    justify-content: space-between;
    align-items: stretch; /* Stretch columns to full height */
    width: 100%;
    max-width: 100%;
    padding: 0;
    height: 100%;
    position: relative;
}

/* Typography */
.main-title,
.side-title {
    font-family: var(--font-heading);
    font-size: clamp(5rem, 10vw, 12rem);
    line-height: 0.8;
    font-weight: 400;
    text-transform: none;
    white-space: nowrap;
    color: white;
    letter-spacing: normal;
}

.outline {
    color: var(--text-color);
}

/* 3b. Left column */
.hero-left {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 6rem 0;
    gap: 2rem;
    z-index: 100;
}

.description {
    color: var(--muted-color);
    font-size: 1.1rem;
    line-height: 1.6;
    max-width: 400px;
}

.cta-group {
    display: flex;
}

.primary-btn {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 0.4rem 0.4rem 0.4rem 1.5rem;
    border-radius: 100px;
    font-weight: 700;
    cursor: pointer;
    width: fit-content;
    transition: all 0.3s ease;
    box-shadow: none;
}

.primary-btn:hover {
    background: rgba(0, 0, 0, 0.7);
    transform: translateY(-3px);
    box-shadow: none;
}

.plus-icon {
    background: #fbcfe8;
    color: #011d17;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 1.4rem;
    font-weight: 900;
    line-height: 1;
    padding-bottom: 2px; /* Compensate for baseline shift */
    border: none;
}

.award-badge {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: auto; /* Push to bottom */
}

.award-icon {
    width: 48px;
    height: 48px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.award-text { display: flex; flex-direction: column; }
.award-title { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted-color); }
.award-subtitle { font-size: 0.85rem; font-weight: 600; }

/* 3c/3d. Center product */
.hero-center {
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    animation: fadeIn 1.5s ease-out 0.3s forwards, float 6s ease-in-out infinite;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(141, 174, 74, 0.12) 0%, transparent 70%);
}

@keyframes fadeIn { to { opacity: 1; } }

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

.main-product-2d {
    width: min(65vw, 920px);
    height: auto;
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 40px 60px rgba(0, 0, 0, 0.55));
    transform: translate(-50%, -50%) rotate(-6deg);
}

/* 3e. Pistachios (floating decorative pieces) */
.pistachios-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 110; /* Above text (100) and product (50) */
    transition: transform 0.1s ease-out;
}

.pistachios-container-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0; /* Behind everything */
    transition: transform 0.1s ease-out;
}

.pistachio {
    position: absolute;
    width: 120px;
    height: 72px;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.p1 { top: 25%; left: 30%; width: 190px; height: 114px; }
.p2 { top: 60%; left: 42%; width: 90px; height: 54px; }
.p3 { top: 30%; left: 62%; width: 210px; height: 126px; }
.p4 { top: 15%; left: 48%; width: 120px; height: 72px; }
.p5 { top: 75%; left: 20%; width: 105px; height: 63px; }
.p6 { top: 45%; left: 75%; width: 150px; height: 90px; }
.p7 { top: 15%; left: 40%; width: 70px; height: 42px; opacity: 0.7; }
.p8 { top: 50%; left: 55%; width: 60px; height: 36px; opacity: 0.6; }
.p9 { top: 80%; left: 35%; width: 65px; height: 39px; opacity: 0.7; }

/* 3f. Right column */
.hero-right {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    text-align: right;
    height: 100%;
    padding: 6rem 0;
    z-index: 100;
    width: 450px;
    pointer-events: none;
}

.product-carousel {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    align-items: flex-end;
    pointer-events: auto; /* Enable interaction */
}

.carousel-cards { display: flex; gap: 1rem; }

.card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 1rem;
    padding-top: 5rem;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    width: 135px;
    position: relative;
    backdrop-filter: blur(10px);
    text-align: center;
}

.card:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.4);
}

.card.active {
    border-color: #fbcfe8;
    border-width: 1px;
    background: var(--glass-bg);
    box-shadow: none;
}

.card img {
    width: 140px;
    height: auto;
    margin-top: -8rem;
    filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.5));
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    display: block;
    will-change: transform;
    pointer-events: none; /* Mouse passes through image to trigger card hover */
}

.card:hover img {
    transform: translateY(-30px) rotate(-12deg) scale(1.15) !important;
}

.card.wide-product {
    width: 230px;
    padding-top: 3.5rem;
}

.card.wide-product img {
    width: 190px;
    margin-top: -2.5rem;
}

.card.wide-product:hover img {
    transform: translateY(-16px) rotate(-6deg) scale(1.1) !important;
}

.card-info {
    display: flex;
    flex-direction: column;
    font-size: 0.7rem;
    width: 100%;
    word-wrap: break-word;
}

.card-info span:first-child { font-weight: 600; }
.card-info span:last-child { color: var(--muted-color); }

.side-title { align-self: flex-end; text-align: right; }

@keyframes shine {
    from { transform: translateX(-100%) rotate(45deg); }
    to { transform: translateX(200%) rotate(45deg); }
}

@media (max-width: 1200px) {
    .main-product-2d { width: 90vw; top: 40%; }
}

@media (max-width: 1200px) {
    .hero-content { grid-template-columns: 1fr; padding-top: 8rem; }
    .hero-center { order: -1; }
    .main-title, .side-title { font-size: 5rem; }
    .hero-right { align-items: center; text-align: center; }
    .side-title { align-self: center; text-align: center; }
}
</style>
</head>

<svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
        <symbol id="pistachio-icon" viewBox="0 0 100 60">
            <path d="M50 30 C 22 4, 4 14, 7 30 C 4 46, 22 56, 50 30 Z" fill="#e6d7ae" stroke="#c7b483" stroke-width="1.5"/>
            <path d="M50 30 C 78 4, 96 14, 93 30 C 96 46, 78 56, 50 30 Z" fill="#f0e6c9" stroke="#c7b483" stroke-width="1.5"/>
            <ellipse cx="50" cy="30" rx="11" ry="17" fill="#93b34f"/>
            <path d="M46 40 C 48 46, 54 46, 56 40 C 54 43, 48 43, 46 40 Z" fill="#b4436c" opacity="0.85"/>
        </symbol>
    </defs>
</svg>

<script>
const productImage = document.querySelector('#product-image');
const pistachiosFG = document.querySelector('.pistachios-container');
const pistachiosBG = document.querySelector('.pistachios-container-bg');
const allPistachios = document.querySelectorAll('.pistachio');

// Track pistachio states for smoothing
allPistachios.forEach(p => {
    p.dataset.rx = 0; p.dataset.ry = 0; p.dataset.angle = Math.random() * 360;
    p.dataset.baseX = 0; p.dataset.baseY = 0;
});

let mouse = { x: 0, y: 0, px: 0, py: 0 };
let currentMouse = { x: 0, y: 0 };

window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) - 0.5;
    mouse.y = (e.clientY / window.innerHeight) - 0.5;
    mouse.px = e.clientX;
    mouse.py = e.clientY;
});

function animate() {
    const time = Date.now() * 0.001;
    // Smoothly interpolate current mouse to target mouse
    currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
    currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

    // Tilt the product image toward the cursor
    productImage.style.transform = `translate(-50%, -50%) perspective(1200px) rotateX(${(-currentMouse.y * 20)}deg) rotateY(${(currentMouse.x * 30)}deg) rotate(-6deg)`;

    // Update parallax containers
    pistachiosFG.style.transform = `translate(${currentMouse.x * 60}px, ${currentMouse.y * 60}px)`;
    pistachiosBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;

    // Update each pistachio with its own smoothing and float
    allPistachios.forEach((piece, i) => {
        const rect = piece.getBoundingClientRect();
        const pieceX = rect.left + rect.width / 2;
        const pieceY = rect.top + rect.height / 2;

        const diffX = mouse.px - pieceX;
        const diffY = mouse.py - pieceY;
        const distance = Math.sqrt(diffX * diffX + diffY * diffY);

        let targetRx = 0, targetRy = 0, speedMult = 1;

        if (distance < 400) {
            const force = (400 - distance) / 400;
            targetRx = (diffX / distance) * force * -80;
            targetRy = (diffY / distance) * force * -80;
            speedMult = 1 + force * 5;
        }

        // Lerp repulsion values
        let rx = parseFloat(piece.dataset.rx) || 0;
        let ry = parseFloat(piece.dataset.ry) || 0;
        let angle = parseFloat(piece.dataset.angle) || 0;
        let baseX = parseFloat(piece.dataset.baseX) || 0;
        let baseY = parseFloat(piece.dataset.baseY) || 0;

        rx += (targetRx - rx) * 0.1;
        ry += (targetRy - ry) * 0.1;
        angle += 0.2 * speedMult;

        piece.dataset.rx = rx;
        piece.dataset.ry = ry;
        piece.dataset.angle = angle;

        // Floating effect
        const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
        const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
        const floatY = Math.sin(phase) * 15;
        const floatAngle = Math.cos(phase) * 6;

        piece.style.transform = `translate(calc(${rx + baseX}px), calc(${ry + baseY}px + ${floatY}px)) rotate(calc(${angle}deg + ${floatAngle}deg))`;
    });

    requestAnimationFrame(animate);
}

animate();

// Ambient rising particles
const bubblesContainer = document.getElementById('bubbles-container');
function createBubble() {
    if (!bubblesContainer) return;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random() * 20 + 10 + 'px';
    bubble.style.width = size;
    bubble.style.height = size;
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.bottom = '-50px';
    bubble.style.opacity = Math.random() * 0.4 + 0.2;

    const duration = Math.random() * 6 + 4;
    bubble.style.animation = `floatUpImg ${duration}s linear forwards`;

    bubblesContainer.appendChild(bubble);
    setTimeout(() => bubble.remove(), duration * 1000);
}
setInterval(createBubble, 400);
</script>
